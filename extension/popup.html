<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Click Inspector</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <strong>Click Inspector</strong>
    <span id="where" class="muted"></span>
  </header>

  <p id="unsupported" class="note" hidden>Open www.kasomaibrahim.dev or localhost:3000 to inspect clicks.</p>
  <p id="reload" class="note" hidden>Reload this tab once so the inspector can attach to it.</p>

  <main id="main" hidden>
    <form id="key-form">
      <label for="key">Read key</label>
      <div class="row">
        <input id="key" type="password" autocomplete="off" placeholder="ANALYTICS_READ_KEY" />
        <button type="submit">Save</button>
      </div>
    </form>

    <div class="row controls">
      <select id="days" aria-label="Period">
        <option value="1">Today</option>
        <option value="7">7 days</option>
        <option value="30" selected>30 days</option>
        <option value="90">90 days</option>
        <option value="365">365 days</option>
      </select>
      <button id="toggle" type="button">Show overlay</button>
    </div>

    <p id="error" class="error" hidden></p>

    <section id="report" hidden>
      <p class="summary"><span id="views">0</span> views of <code id="path"></code></p>
      <table>
        <thead><tr><th>Element</th><th class="num">Clicks</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <details>
        <summary>Views by page</summary>
        <table><tbody id="pages"></tbody></table>
      </details>
    </section>

    <label class="check"><input id="opt-out" type="checkbox" /> Don't count my visits on this site</label>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
